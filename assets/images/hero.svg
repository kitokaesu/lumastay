  <path d="M0 655c180-84 300-164 470-126 170 38 250 98 400 60 150-38 300-120 460-72 90 27 170 60 270 50v433H0Z" fill="url(#hillFar)" opacity=".78"/>

  <rect y="690" width="1600" height="120" fill="url(#sea)"/>
  <g stroke="#C8D9D2" stroke-width="3" opacity=".35">
