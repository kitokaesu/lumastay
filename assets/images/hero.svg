<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Casa portuguesa entre colinas ao entardecer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE3D2"/>
      <stop offset=".52" stop-color="#E4C9A6"/>
      <stop offset="1" stop-color="#C99870"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FBE9C7" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#F2D09B" stop-opacity=".5"/>
      <stop offset="1" stop-color="#F2D09B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#567C77"/>
      <stop offset="1" stop-color="#274F4B"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C8C75"/>
      <stop offset="1" stop-color="#4D6359"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D5B50"/>
      <stop offset="1" stop-color="#1D3B37"/>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF7EF"/>
      <stop offset="1" stop-color="#DCD3C2"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".09"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1190" cy="315" r="280" fill="url(#sunGlow)"/>
  <circle cx="1190" cy="315" r="66" fill="#F7DFB4"/>

